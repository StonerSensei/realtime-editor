services:
  mongo:
    image: mongo:7
    container_name: collabide-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not exposed to the host by default; only the app needs it. Uncomment to inspect.
    # ports:
    #   - "27017:27017"

  app:
    build: .
    image: collabide:latest
    container_name: collabide-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Point at the mongo service on the compose network
      MONGODB_URI: mongodb://mongo:27017/editor
      # Override in .env for anything non-local (must be >= 32 chars)
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-characters-long}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Code execution: this path must be identical inside the container and on the
      # host, because the host Docker daemon resolves the sandbox bind-mount path.
      EXEC_WORK_DIR: /tmp/collabide-exec
    volumes:
      # Docker-out-of-Docker: let the app drive the host daemon to run code sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared work dir at the SAME absolute path on host and container so that
      # "docker run -v /tmp/collabide-exec/<id>:/code" resolves correctly on the host
      - /tmp/collabide-exec:/tmp/collabide-exec

volumes:
  mongo-data:
