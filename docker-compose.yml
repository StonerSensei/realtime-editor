services:
  mongo:
    image: mongo:7
    container_name: collabide-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: collabide-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    image: collabide:latest
    container_name: collabide-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/editor
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-min-32-characters-long}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      EXEC_WORK_DIR: /tmp/collabide-exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/collabide-exec:/tmp/collabide-exec

  frontend:
    build: ./frontend
    image: collabide-frontend:latest
    container_name: collabide-frontend
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: collabide-caddy
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  caddy-data:
  caddy-config: