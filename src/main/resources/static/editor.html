<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabIDE - Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/editor.css">
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="logo">
        <i class="fas fa-code"></i> CollabIDE
    </div>
    <div class="room-info">
        <div class="room-badge">
            <i class="fas fa-door-open"></i>
            <span id="roomDisplay">Loading...</span>
        </div>
        <div class="room-badge" id="roleBadge">
            <i class="fas fa-user-tag"></i>
            <span id="roleText">...</span>
        </div>
        <div class="room-badge">
            <div class="status-indicator"></div>
            <span id="connectionStatus">Connecting...</span>
        </div>
        <div class="room-badge">
            <i class="fas fa-users"></i>
            <span id="userCount">1</span> online
        </div>
    </div>
</div>

<!-- Main Container -->
<div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <button class="sidebar-btn" data-drawer="files" title="Files">
            <i class="fas fa-folder"></i>
        </button>
        <button class="sidebar-btn" data-drawer="chat" title="Chat">
            <i class="fas fa-comments"></i>
        </button>
        <button class="sidebar-btn" data-drawer="participants" title="Participants">
            <i class="fas fa-users"></i>
        </button>
        <button class="sidebar-btn" data-drawer="history" title="Version History">
            <i class="fas fa-history"></i>
        </button>
    </div>

    <!-- Editor Area -->
    <div class="editor-area">
        <div class="editor-header">
            <div class="file-tabs">
                <div class="file-tab active">
                    <i class="fas fa-file-code"></i>
                    <span id="filename">main.js</span>
                </div>
            </div>
            <div class="editor-actions">
                <button class="action-btn run" id="runBtn">
                    <i class="fas fa-play"></i> Run
                </button>
                <button class="action-btn download" id="downloadBtn">
                    <i class="fas fa-download"></i> Save
                </button>
                <button class="action-btn exit" id="exitBtn">
                    <i class="fas fa-sign-out-alt"></i> Exit
                </button>
            </div>
        </div>

        <!-- Read-only banner (shown for viewers) -->
        <div id="readOnlyBanner" class="readonly-banner hidden">
            <i class="fas fa-eye"></i> View-only mode &mdash; you don't have edit permission in this room.
        </div>

        <!-- Code Editor -->
        <textarea id="code" style="display:none;"></textarea>
    </div>

    <!-- Right Drawer: Chat / Participants / History -->
    <div class="drawer hidden" id="drawer">
        <div class="drawer-header">
            <span id="drawerTitle">Chat</span>
            <button class="clear-btn" id="drawerClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body">
            <!-- Files -->
            <div class="drawer-panel hidden" id="panel-files">
                <div class="files-toolbar">
                    <span class="hint">Project files</span>
                    <button class="clear-btn" id="newFileBtn"><i class="fas fa-plus"></i> New</button>
                </div>
                <ul class="file-list" id="fileList"></ul>
            </div>

            <!-- Chat -->
            <div class="drawer-panel" id="panel-chat">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="2000">
                    <button class="btn btn-primary" id="chatSend"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- Participants -->
            <div class="drawer-panel hidden" id="panel-participants">
                <ul class="participant-list" id="participantList"></ul>
            </div>

            <!-- History -->
            <div class="drawer-panel hidden" id="panel-history">
                <div class="history-toolbar">
                    <span class="hint">Auto-saved versions (newest first)</span>
                    <button class="clear-btn" id="historyRefresh"><i class="fas fa-sync"></i></button>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Panel -->
<div class="bottom-panel" id="bottomPanel">
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="panel-tabs">
        <button class="panel-tab active">
            <i class="fas fa-terminal"></i> Terminal
        </button>
        <button class="panel-tab">
            <i class="fas fa-keyboard"></i> Input
        </button>
    </div>
    <div class="panel-content">
        <div class="input-section">
            <h4><i class="fas fa-keyboard"></i> Custom Input (stdin):</h4>
            <textarea id="userInput" class="input-area" placeholder="Enter program input here..."></textarea>
        </div>
        <div class="output-section">
            <div class="output-header">
                <h4><i class="fas fa-terminal"></i> Output</h4>
                <button class="clear-btn" id="clearOutput">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
            <div id="output" class="output-display">Ready to execute code...</div>
        </div>
    </div>
</div>

<!-- Download Modal -->
<div id="filenameModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3><i class="fas fa-save"></i> Save File</h3>
        <input type="text" id="filenameInput" placeholder="Enter filename (without extension)">
        <div class="modal-actions">
            <button class="btn btn-primary" id="confirmDownload">
                <i class="fas fa-download"></i> Download
            </button>
            <button class="btn btn-danger" id="cancelDownload">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/rooms.js"></script>
<script src="/js/files.js"></script>

<!-- Yjs CRDT collaboration (ES modules via CDN). The import map pins a single
     copy of yjs so all packages share the same instance. -->
<script type="importmap">
{
  "imports": {
    "yjs": "https://esm.sh/yjs@13.6.20",
    "y-codemirror": "https://esm.sh/y-codemirror@3.0.1?deps=yjs@13.6.20",
    "y-protocols/awareness": "https://esm.sh/y-protocols@1.0.6/awareness?deps=yjs@13.6.20"
  }
}
</script>
<script type="module" src="/js/collab.js"></script>
</body>
</html>
