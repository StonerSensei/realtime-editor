<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabIDE - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 25% 25%, rgba(139, 233, 253, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(189, 147, 249, 0.1) 0%, transparent 50%);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        h1 {
            color: var(--accent);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            text-align: center;
            color: rgba(248, 248, 242, 0.6);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            background: var(--secondary);
            color: var(--text);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: var(--secondary);
        }

        .tab:hover:not(.active) {
            background: rgba(189, 147, 249, 0.2);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.75rem;
            text-align: center;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        @media (max-width: 500px) {
            .auth-container { padding: 1.5rem; margin: 1rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="card auth-container">
    <h1><i class="fas fa-code"></i> CollabIDE</h1>
    <p class="subtitle">Sign in to start collaborating</p>

    <div class="tabs">
        <button class="tab active" id="loginTab" onclick="showLogin()">Login</button>
        <button class="tab" id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="loginUsername"><i class="fas fa-user"></i> Username</label>
            <input id="loginUsername" type="text" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
            <input id="loginPassword" type="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary submit-btn">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <p class="error-msg" id="loginError"></p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="regUsername"><i class="fas fa-user"></i> Username</label>
            <input id="regUsername" type="text" placeholder="Choose a username" minlength="3" maxlength="30" required>
        </div>
        <div class="form-group">
            <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
            <input id="regEmail" type="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
            <input id="regPassword" type="password" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary submit-btn">
            <i class="fas fa-user-plus"></i> Register
        </button>
        <p class="error-msg" id="registerError"></p>
    </form>
</div>

<div id="toast" class="toast"></div>

<script src="/js/auth.js"></script>
<script>
// Redirect if already logged in
if (Auth.isAuthenticated()) {
    window.location.href = "/index.html";
}

function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");
}

function showRegister() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");
    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("registerTab").classList.add("active");
}

async function handleLogin(e) {
    e.preventDefault();
    const errorEl = document.getElementById("loginError");
    errorEl.classList.remove("show");

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
            errorEl.textContent = data.message || "Login failed";
            errorEl.classList.add("show");
            return;
        }

        Auth.setCredentials(data.token, data.username, data.refreshToken);
        window.location.href = "/index.html";
    } catch (err) {
        errorEl.textContent = "Connection error. Please try again.";
        errorEl.classList.add("show");
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const errorEl = document.getElementById("registerError");
    errorEl.classList.remove("show");

    const username = document.getElementById("regUsername").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;

    try {
        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (!res.ok) {
            const msg = data.validationErrors
                ? Object.values(data.validationErrors).join(". ")
                : data.message || "Registration failed";
            errorEl.textContent = msg;
            errorEl.classList.add("show");
            return;
        }

        Auth.setCredentials(data.token, data.username, data.refreshToken);
        window.location.href = "/index.html";
    } catch (err) {
        errorEl.textContent = "Connection error. Please try again.";
        errorEl.classList.add("show");
    }
}
</script>
</body>
</html>
