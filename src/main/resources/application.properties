spring.application.name=realtime-editor
server.port=${PORT:8080}
# Connection string comes from the MONGODB_URI env var; the local default is dev-only.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/editor}
# Create @Indexed indexes (unique constraints + the refresh-token TTL index) on startup.
spring.data.mongodb.auto-index-creation=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Redis (shared/distributed state). Connection is lazy, so the app still boots if Redis is down;
# the Redis health indicator (below) surfaces its status at /actuator/health.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1000ms
management.health.redis.enabled=true

# JWT Configuration
# IMPORTANT: set a strong JWT_SECRET (>= 32 chars) in every non-local environment.
# The value below is a development-only fallback and must never be used in production.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-min-32-characters-long}
# Short-lived access token (default 30 min). Set low (e.g. 60000) to test refresh quickly.
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION:1800000}
# Long-lived refresh token (default 7 days)
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Code Execution (ephemeral Docker containers)
execution.timeout-seconds=${EXEC_TIMEOUT:15}
execution.memory-limit=${EXEC_MEMORY:256m}
execution.cpu-limit=${EXEC_CPUS:0.5}
execution.max-output-chars=${EXEC_MAX_OUTPUT:100000}
# Base dir for sandbox temp files. In Docker (DooD) set this to a path bind-mounted
# at the SAME location on host + container. Empty = JVM temp dir (local runs).
execution.work-dir=${EXEC_WORK_DIR:}

# Auth rate limiting (token bucket per client IP)
auth.rate-limit.capacity=${AUTH_RATE_CAPACITY:10}
auth.rate-limit.refill-minutes=${AUTH_RATE_REFILL_MINUTES:1}

# Actuator / Micrometer
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# App info (surfaced at /actuator/info)
info.app.name=CollabIDE
info.app.description=Real-time collaborative code editor
info.app.version=0.0.1-SNAPSHOT

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins.
# Default is localhost:3000 (Next.js dev server).
# In production, set this to your real frontend URL, e.g.:
#   cors.allowed-origins=https://collabide.your-domain.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.forward-headers-strategy=native

execution.mode=${EXECUTION_MODE:docker}
execution.worker-url=${EXECUTION_WORKER_URL:}
execution.worker-secret=${EXECUTION_WORKER_SECRET:}
