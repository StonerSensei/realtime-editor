spring.application.name=realtime-editor-test

# Uses the existing MongoDB Docker container on localhost
spring.data.mongodb.uri=mongodb://localhost:27017/editor-test

# JWT Config for tests
jwt.secret=test-secret-key-for-unit-tests-minimum-32-characters-long
jwt.expiration-ms=3600000

# Disable auto-config that causes issues in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
